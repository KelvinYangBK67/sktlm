# Copy this file to the repository root as `.sktlm-bridge.toml` and edit the
# operational values. The local file is gitignored. Never store passwords,
# private-key contents, access tokens, or other secrets here.

[bridge]
host = "cloud-host.example.org"
user = "ubuntu"
port = 22
identity_file = "~/.ssh/id_ed25519"

remote_repo = "/home/ubuntu/sktlm"
remote_data_mount = "/mnt/sktlm-data"
remote_cloud_root = "/mnt/sktlm-data/sktlm"

branch = "exp/m0-core-methods"
repository_url = "https://github.com/KelvinYangBK67/sktlm.git"

# Optional multi-host overlays. The [bridge] table above remains the
# backward-compatible single-host configuration. Copy this file to the ignored
# `.sktlm-bridge.toml`, replace only local operational values, and select one
# profile with `--host-profile` after the bridge subcommand.

[host_profiles.core-01]
machine_id = "core-01"
host = "core-01.example.org"

[host_profiles.core-02]
machine_id = "core-02"
host = "core-02.example.org"

[host_profiles.core-03]
machine_id = "core-03"
host = "core-03.example.org"

[host_profiles.core-04]
machine_id = "core-04"
host = "core-04.example.org"

[host_profiles.core-05]
