freeze_id: 9c515ca46ad8f9fca7e879c0a1617207bf5ccf3df21930aaa0995227c3942c40
canonical_manifest: data/manifests/canonical_corpus.csv
representation_manifest: data/manifests/representations.csv
artifact_root: artifacts/baselines/m0
seed: 0
vocab_size: 24000
condition_manifest_version: m0-baselines-v2

downstream_lm:
  contract_version: m0-common-downstream-lm-v1
  model_class: TinyDecoderOnlyTransformer
  context_length: 32
  n_embd: 64
  n_head: 2
  n_layer: 2
  dropout: 0.0
  batch_size: 8
  learning_rate: 0.001
  max_steps: 20
  shuffle_buffer_blocks: 1024
  eval_split: test
  device: cuda
  optimizer: AdamW
  context_policy: segment_contained_sliding_context_v1
  scoring_protocol: each_within_segment_target_once_v1
  canonical_unit: frozen_iast_surface_word_unicode_codepoint_v1
  prepend_bos: true
  append_eos: true
  deterministic_algorithms: true

# Historical 22-cell design, retained verbatim with versioned validity status.
# The anchor guarantees that all four retired cells carry identical provenance.
iast_continuous_retirement: &iast_continuous_retirement
  status: retired
  decision_id: iast-continuous-representation-validity-v1
  reason: "IAST continuous is not injective: removing word spaces can make cross-word vowel hiatus indistinguishable from standard IAST diphthong spelling"

conditions:
  - {method: bpe, script: iast, spacing: surface_word, status: valid}
  - {method: bpe, script: iast, spacing: legacy_joined, status: valid}
  - method: bpe
    script: iast
    spacing: continuous
    <<: *iast_continuous_retirement
  - {method: bpe, script: devanagari, spacing: surface_word, status: valid}
  - {method: bpe, script: devanagari, spacing: legacy_joined, status: valid}
  - {method: bpe, script: devanagari, spacing: continuous, status: valid}

  - {method: unigram, script: iast, spacing: surface_word, status: valid}
  - {method: unigram, script: iast, spacing: legacy_joined, status: valid}
  - method: unigram
    script: iast
    spacing: continuous
    <<: *iast_continuous_retirement
  - {method: unigram, script: devanagari, spacing: surface_word, status: valid}
  - {method: unigram, script: devanagari, spacing: legacy_joined, status: valid}
  - {method: unigram, script: devanagari, spacing: continuous, status: valid}

  - {method: unicode_codepoint, script: iast, spacing: surface_word, status: valid}
  - {method: unicode_codepoint, script: iast, spacing: legacy_joined, status: valid}
  - method: unicode_codepoint
    script: iast
    spacing: continuous
    <<: *iast_continuous_retirement
  - {method: unicode_codepoint, script: devanagari, spacing: surface_word, status: valid}
  - {method: unicode_codepoint, script: devanagari, spacing: legacy_joined, status: valid}
  - {method: unicode_codepoint, script: devanagari, spacing: continuous, status: valid}

  - {method: aksara_safe_bpe, script: devanagari, spacing: continuous, status: valid}
  - {method: surface_lattice, script: iast, spacing: surface_word, status: valid}
  - {method: surface_lattice, script: iast, spacing: legacy_joined, status: valid}
  - method: surface_lattice
    script: iast
    spacing: continuous
    <<: *iast_continuous_retirement
