run_id: spacing_continuous_character_seed0
data:
  manifest: data/manifests/corpus_manifest.csv
  split: test
  max_train_segments: 128
  max_eval_segments: 64
representation: {script: devanagari, spacing: continuous}
tokenizer: {type: character}
model: {type: tiny_transformer, device: cpu, context_length: 32, n_embd: 64, n_head: 2, n_layer: 2, dropout: 0.0}
training: {batch_size: 8, learning_rate: 0.001, max_steps: 20, eval_interval: 5, max_train_examples: 64, max_eval_examples: 16}
seed: 0
evaluation:
  prediction_examples: 5
  sandhi_patterns: ["ोऽपि", "ोऽ", "ेऽ"]
