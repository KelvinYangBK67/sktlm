# Tiny overfit defaults. These are intentionally conservative and are meant
# only to verify the local data/model/training loop.
project_name: sanskrit_llm
tokenizer_type: sentencepiece
tokenizer_path: artifacts/tokenizers/ambuda_unigram_8192.model
data_dir: data/processed/ambuda-text
output_dir: artifacts/checkpoints
vocab_size: 8192
model_size: tiny
